<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Pulpe | Prototipo navegable</title><style>
:root{--bg:#101415;--panel:#1c2321;--panel2:#0b1915;--green:#28e574;--darkgreen:#08653b;--border:#28d47a;--red:#6b2d39;--muted:#b6c2bd;--text:#f5f7f6}*{box-sizing:border-box}body{margin:0;background:#0c1010;color:var(--text);font:16px Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:1510px;min-height:100vh;margin:auto;padding:20px 24px 28px}.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.brand h1{font-size:40px;line-height:1;margin:0;color:var(--green)}.brand p{margin:8px 0 0;color:var(--muted)}.user{font-weight:700;color:var(--green);padding-top:6px}.btn{border:2px solid var(--border);background:#10623c;color:white;border-radius:11px;padding:12px 20px;font-weight:700;min-height:44px}.btn:hover{filter:brightness(1.15)}.btn.danger{background:var(--red);border-color:#bb6376}.btn.ghost{background:var(--panel)}.btn.small{padding:9px 15px}.panel{border:2px solid var(--border);border-radius:20px;padding:22px;background:#0d1714}.panel h2{color:var(--green);margin:0 0 22px;font-size:27px}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}.field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}.field label{font-size:15px;color:#d9e0dc}input,select{width:100%;background:#232b28;border:2px solid #3b5148;color:white;border-radius:9px;padding:12px;min-height:45px}input:focus,select:focus{outline:none;border-color:var(--green)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.actions .btn{min-width:145px}.tablewrap{overflow:auto;border:1px solid #1d8552;min-height:300px;background:#0a1512}.table{width:100%;border-collapse:collapse;text-align:left}.table th{background:#075c3a;color:white;padding:12px;font-size:14px;white-space:nowrap}.table td{padding:11px;border-bottom:1px solid #2c4b3d;font-size:14px}.table tr.selectable{cursor:pointer}.table tr.selectable:hover,.table tr.selected{background:#1b4632}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;color:var(--muted)}.notice{margin-top:15px;min-height:26px;color:#ffd88c}.notice.ok{color:#73f5a3}.login{max-width:580px;margin:6vh auto;padding:28px 18px 18px;background:var(--bg);border:1px solid #38453f;border-radius:12px}.login h1{text-align:center;font-size:34px;margin:0 0 12px}.login .subtitle{text-align:center;margin-bottom:26px}.login .btn{width:100%;margin-top:7px}.hint{font-size:13px;color:var(--muted);margin-top:14px;text-align:center}.menu{display:grid;grid-template-columns:1fr 1fr;gap:20px}.menu button{height:220px;border:2px solid var(--border);background:var(--panel);border-radius:20px;color:white;font-size:26px;font-weight:bold}.menu button:hover{background:#234b38}.menu button:first-child{background:#234b38}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.toolbar input{flex:1;min-width:180px}.toolbar .date{max-width:170px}.price{font-size:42px;color:var(--green);font-weight:800;margin:36px 0 45px}.status{color:var(--muted);margin-top:15px}.split{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}.formrow{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:12px;margin:12px 0}.formrow label{color:#c7d1cb}.stat{font-weight:bold;color:var(--green);text-align:right;font-size:25px;padding:16px 0}.subpanel{border:2px solid var(--border);border-radius:18px;padding:18px;min-width:0}.subpanel h3{font-size:25px;color:var(--green);margin:0 0 16px}.empty{color:#93a69b;padding:25px 12px;text-align:center}.row{display:flex;gap:12px;align-items:center}.row>*{min-width:0}.row .grow{flex:1}.receipt{background:#f7f7f7;color:#1a1a1a;padding:20px;border-radius:8px;white-space:pre-wrap;font:14px/1.55 monospace;max-height:320px;overflow:auto}.tag{font-size:12px;color:#f1d39c;border:1px solid #765f36;padding:5px 9px;border-radius:10px}.hidden{display:none!important}@media(max-width:900px){.grid2,.split,.menu{grid-template-columns:1fr}.menu button{height:120px}.shell{padding:16px}.brand h1{font-size:32px}.formrow{grid-template-columns:1fr}.toolbar .date{max-width:none}.price{margin:16px 0 25px}}
</style></head><body><main id="app"></main><script>
const $=s=>document.querySelector(s),money=n=>'₡'+Number(n||0).toLocaleString('es-CR'),escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='login',current=null,selectedProduct=null,selectedUser=null,selectedSale=null,cart=[],notice='',noticeOK=false,searchProduct='',searchHistory='';
let products=[{id:101,name:'Arroz 1kg',price:1500,category:'Abarrotes',stock:35,active:true},{id:102,name:'Café molido',price:3200,category:'Abarrotes',stock:20,active:true},{id:103,name:'Leche',price:1200,category:'Lácteos',stock:18,active:true},{id:104,name:'Azúcar 1kg',price:1100,category:'Abarrotes',stock:25,active:true},{id:105,name:'Pan cuadrado',price:1900,category:'Panadería',stock:12,active:true}];
let users=[{id:1,name:'Victor Diaz',username:'admin',password:'admin123',role:'Administrador',active:true},{id:2,name:'Cajero Demo',username:'cajero',password:'cajero123',role:'Cajero',active:true}];let sales=[],nextSale=1;
const allowed=(p)=>current&&(current.role==='Administrador'||p==='sales'||p==='history');
function flash(msg,ok=false){notice=msg;noticeOK=ok;render()}
function go(p){if(p!=='login'&&!current){page='login';render();return}if(['products','users'].includes(p)&&!allowed(p)){flash('Acceso denegado: solo el administrador puede ingresar a este módulo.');return}page=p;notice='';selectedProduct=null;selectedUser=null;selectedSale=null;render()}
function layout(title,sub,content){return `<div class="shell"><header class="brand"><div><h1>La Pulpe</h1><p>${sub}</p></div><div class="user">${escapeHTML(current.name)} - ${current.role}</div></header>${content}<div class="foot"><span>Bienvenido a La Pulpe. <span class="tag">Prototipo de demostración</span></span>${page==='menu'?'<button class="btn danger" onclick="logout()">↪ Cerrar sesión</button>':'<button class="btn danger" onclick="go(\'menu\')">← Regresar</button>'}</div>${notice?`<div class="notice ${noticeOK?'ok':''}" role="status">${escapeHTML(notice)}</div>`:''}</div>`}
function render(){let html='';if(page==='login'){html=`<div class="login"><h1>LA PULPE</h1><p class="subtitle">Inicio de sesión</p><form onsubmit="login(event)"><div class="field"><label>Nombre de usuario</label><input id="loginUser" placeholder="Ingrese su usuario" required autofocus></div><div class="field"><label>Contraseña</label><input id="loginPass" type="password" placeholder="Ingrese su contraseña" required></div><button class="btn" type="submit">Iniciar sesión</button><button type="button" class="btn danger" onclick="exitDemo()">↪ Salir</button></form><div class="actions" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px"><button type="button" class="btn" onclick="demoAccess('Administrador')">Entrar como administrador</button><button type="button" class="btn ghost" onclick="demoAccess('Cajero')">Entrar como cajero</button></div><p class="hint">También podés ingresar con admin / admin123 o cajero / cajero123.</p>${notice?`<p class="notice">${escapeHTML(notice)}</p>`:''}</div>`}
else if(page==='menu'){html=layout('La Pulpe','Sistema de ventas e inventario',`<section class="menu"><button onclick="go('products')" ${!allowed('products')?'disabled title="Solo administrador"':''}>▣ Productos e Inventarios</button><button onclick="go('sales')">🛒 Ventas y Cobros</button><button onclick="go('history')">▤ Historial y Tickets</button><button onclick="go('users')" ${!allowed('users')?'disabled title="Solo administrador"':''}>♙ Gestión de Usuarios</button></section>`)}
else if(page==='products'){let rows=products.filter(p=>(p.id+' '+p.name+' '+p.category).toLowerCase().includes(searchProduct.toLowerCase())).map(p=>`<tr class="selectable ${selectedProduct===p.id?'selected':''}" onclick="pickProduct(${p.id})"><td>${p.id}</td><td>${escapeHTML(p.name)}</td><td>${money(p.price)}</td><td>${escapeHTML(p.category)}</td><td>${p.stock}</td><td>${p.active?'Activo':'Inactivo'}</td></tr>`).join('');let p=products.find(x=>x.id===selectedProduct);html=layout('La Pulpe','Gestión de productos e inventario',`<div class="panel"><h2>◇ Productos e Inventario</h2><div class="split"><section class="subpanel"><h3>▦ Productos</h3><div class="toolbar"><input placeholder="Buscar por código o nombre..." value="${escapeHTML(searchProduct)}" oninput="searchProduct=this.value;renderProductsTable()" id="productSearch"></div><div class="tablewrap"><table class="table"><thead><tr><th>Código</th><th>Nombre</th><th>Precio</th><th>Categoría</th><th>Existencias</th><th>Estado</th></tr></thead><tbody id="productRows">${rows}</tbody></table></div></section><section class="subpanel"><h3>▣ Datos del producto</h3><div class="formrow"><label>Código:</label><input id="pId" type="number" min="1" value="${p?.id??''}" placeholder="Código"></div><div class="formrow"><label>Nombre:</label><input id="pName" value="${escapeHTML(p?.name??'')}" placeholder="Nombre del producto"></div><div class="formrow"><label>Precio:</label><input id="pPrice" type="number" min="0" step="1" value="${p?.price??''}" placeholder="₡ 0.00"></div><div class="formrow"><label>Categoría:</label><input id="pCategory" value="${escapeHTML(p?.category??'')}" placeholder="Categoría (opcional)"></div><div class="formrow"><label>Existencias:</label><input id="pStock" type="number" min="0" value="${p?.stock??0}"></div><div class="formrow"><label>Estado:</label><select id="pActive"><option value="true" ${p?.active!==false?'selected':''}>Activo</option><option value="false" ${p?.active===false?'selected':''}>Inactivo</option></select></div></section></div><div class="actions"><button class="btn" onclick="saveProduct(false)">＋ Agregar</button><button class="btn" onclick="saveProduct(true)">✎ Editar</button><button class="btn danger" onclick="deactivateProduct()">⊘ Desactivar</button><button class="btn" onclick="newProduct()">＋ Nuevo</button></div></div>`)}
else if(page==='users'){let u=users.find(x=>x.id===selectedUser);html=layout('La Pulpe','Administración de usuarios',`<div class="panel"><h2>Gestión de usuarios</h2><div class="formrow"><label>Nombre completo</label><input id="uName" value="${escapeHTML(u?.name??'')}"></div><div class="formrow"><label>Nombre de usuario</label><input id="uLogin" value="${escapeHTML(u?.username??'')}"></div><div class="formrow"><label>Contraseña</label><input id="uPass" type="password" placeholder="${u?'Dejar vacío para conservar la actual':'Ingrese contraseña'}"></div><div class="formrow"><label>Rol</label><select id="uRole"><option ${u?.role==='Administrador'?'selected':''}>Administrador</option><option ${u?.role==='Cajero'?'selected':''}>Cajero</option></select></div><div class="tablewrap"><table class="table"><thead><tr><th>Nombre completo</th><th>Usuario</th><th>Rol</th><th>Estado</th></tr></thead><tbody>${users.map(x=>`<tr class="selectable ${selectedUser===x.id?'selected':''}" onclick="pickUser(${x.id})"><td>${escapeHTML(x.name)}</td><td>${escapeHTML(x.username)}</td><td>${x.role}</td><td>${x.active?'Activo':'Inactivo'}</td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn" onclick="saveUser(false)">＋ Agregar</button><button class="btn" onclick="saveUser(true)">✎ Modificar</button><button class="btn danger" onclick="deactivateUser()">↓ Desactivar</button><button class="btn" onclick="newUser()">♧ Limpiar</button></div></div>`)}
else if(page==='sales'){let total=cart.reduce((s,i)=>s+i.price*i.qty,0);html=layout('La Pulpe','Ventas y cobros',`<div class="grid2"><section class="panel"><h2>Carrito de compra</h2><div class="toolbar"><select id="saleProduct" style="flex:2">${products.filter(p=>p.active&&p.stock>0).map(p=>`<option value="${p.id}">${escapeHTML(p.name)} — ${money(p.price)} (stock: ${p.stock})</option>`).join('')}</select><input type="number" min="1" value="1" id="saleQty" style="max-width:110px"><button class="btn" onclick="addToCart()">Agregar</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th><th></th></tr></thead><tbody>${cart.length?cart.map((i,k)=>`<tr><td>${escapeHTML(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.price*i.qty)}</td><td><button class="btn danger small" onclick="removeFromCart(${k})">Quitar</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Agregá productos para comenzar la venta.</td></tr>'}</tbody></table></div><div class="actions"><button class="btn danger" onclick="cart=[];flash('Carrito vaciado.')">Quitar todos</button></div></section><section class="panel"><h2>Cobro</h2><div class="price">Total: ${money(total)}</div><div class="field"><label>Efectivo recibido</label><input type="number" min="0" id="cash" placeholder="Monto en colones" value="${window.cashDraft??''}" oninput="window.cashDraft=this.value"></div><button class="btn ghost" style="width:100%;margin-top:22px;font-size:24px" onclick="charge()">Cobrar</button><div class="status">Se verificará el efectivo y la disponibilidad de productos.</div></section></div>`)}
else if(page==='history'){let filtered=sales.filter(s=>{let term=searchHistory.toLowerCase();let a=($('#dateFrom')?.value)||'';let b=($('#dateTo')?.value)||'';return (s.id+' '+s.customer+' '+s.date).toLowerCase().includes(term)&&(!a||s.iso>=a)&&(!b||s.iso<=b)});let s=sales.find(x=>x.id===selectedSale);html=layout('La Pulpe','Historial de ventas y generación de tickets',`<div class="panel"><div class="toolbar"><h2 style="margin:0 12px 0 0">▤ Historial de Ventas</h2><input id="historySearch" placeholder="Buscar por número de venta, cliente o fecha..." value="${escapeHTML(searchHistory)}"><label>Desde:</label><input class="date" id="dateFrom" type="date"><label>Hasta:</label><input class="date" id="dateTo" type="date"><button class="btn" onclick="filterHistory()">Filtrar</button></div><div class="grid2"><div class="tablewrap"><table class="table"><thead><tr><th>N° Venta</th><th>Fecha</th><th>Cliente</th><th>Productos</th><th>Total</th></tr></thead><tbody id="historyRows">${historyRows(filtered)}</tbody></table></div><section class="subpanel"><h3>▤ Detalle de la Venta</h3><p>N° Venta: ${s?.id??'-'}</p><p>Fecha: ${s?.date??'-'}</p><p>Cliente: ${escapeHTML(s?.customer??'-')}</p><div class="tablewrap" style="min-height:180px"><table class="table"><thead><tr><th>Producto</th><th>Cantidad</th><th>Subtotal</th></tr></thead><tbody>${s?s.items.map(i=>`<tr><td>${escapeHTML(i.name)}</td><td>${i.qty}</td><td>${money(i.qty*i.price)}</td></tr>`).join(''):''}</tbody></table></div><div class="stat">Total: ${money(s?.total??0)}</div></section></div><div class="actions"><button class="btn" onclick="render()">Actualizar</button><button class="btn" onclick="downloadTicket('txt')">Generar Ticket (TXT)</button><button class="btn" onclick="downloadTicket('html')">Generar Ticket (HTML)</button></div></div>`)}
$('#app').innerHTML=html}
function demoAccess(role){const u=users.find(x=>x.role===role&&x.active);if(!u){flash('No hay usuario de demostración activo para este rol.');return}current=u;go('menu')}
function login(e){e.preventDefault();let u=users.find(x=>x.username===$('#loginUser').value.trim()&&x.password===$('#loginPass').value&&x.active);if(!u){flash('Usuario o contraseña incorrectos, o cuenta desactivada.');return}current=u;go('menu')}
function logout(){current=null;cart=[];window.cashDraft='';go('login')}function exitDemo(){flash('Para salir del prototipo, cerrá esta pestaña del navegador.')}
function pickProduct(id){selectedProduct=id;render()}function newProduct(){selectedProduct=null;render()}function renderProductsTable(){let input=$('#productSearch');if(!input)return;let v=input.value;searchProduct=v;$('#productRows').innerHTML=products.filter(p=>(p.id+' '+p.name+' '+p.category).toLowerCase().includes(v.toLowerCase())).map(p=>`<tr class="selectable ${selectedProduct===p.id?'selected':''}" onclick="pickProduct(${p.id})"><td>${p.id}</td><td>${escapeHTML(p.name)}</td><td>${money(p.price)}</td><td>${escapeHTML(p.category)}</td><td>${p.stock}</td><td>${p.active?'Activo':'Inactivo'}</td></tr>`).join('')}
function readProduct(){return {id:Number($('#pId').value),name:$('#pName').value.trim(),price:Number($('#pPrice').value),category:$('#pCategory').value.trim(),stock:Number($('#pStock').value),active:$('#pActive').value==='true'}}
function saveProduct(edit){let p=readProduct();if(!Number.isInteger(p.id)||p.id<1||!p.name||$('#pPrice').value===''||p.price<0||!Number.isInteger(p.stock)||p.stock<0){flash('Ingresá código, nombre, precio y existencias válidos.');return}if(edit){if(selectedProduct===null){flash('Seleccioná un producto para editar.');return}if(products.some(x=>x.id===p.id&&x.id!==selectedProduct)){flash('Ya existe otro producto con ese código.');return}products[products.findIndex(x=>x.id===selectedProduct)]=p;selectedProduct=p.id;flash('Producto actualizado correctamente.',true)}else{if(products.some(x=>x.id===p.id)){flash('Ya existe un producto con ese código.');return}products.push(p);selectedProduct=p.id;flash('Producto agregado correctamente.',true)}}
function deactivateProduct(){let p=products.find(x=>x.id===selectedProduct);if(!p){flash('Seleccioná un producto para desactivar.');return}p.active=false;flash('Producto desactivado.',true)}
function pickUser(id){selectedUser=id;render()}function newUser(){selectedUser=null;render()}
function saveUser(edit){let name=$('#uName').value.trim(),username=$('#uLogin').value.trim(),password=$('#uPass').value,role=$('#uRole').value;if(!name||!username||(!edit&&!password)){flash('Completá los datos obligatorios del usuario.');return}if(users.some(u=>u.username===username&&u.id!==selectedUser)){flash('El nombre de usuario ya existe.');return}if(edit){let u=users.find(x=>x.id===selectedUser);if(!u){flash('Seleccioná un usuario para modificar.');return}Object.assign(u,{name,username,role});if(password)u.password=password;flash('Usuario modificado correctamente.',true)}else{let u={id:Math.max(...users.map(x=>x.id),0)+1,name,username,password,role,active:true};users.push(u);selectedUser=u.id;flash('Usuario agregado correctamente.',true)}}
function deactivateUser(){let u=users.find(x=>x.id===selectedUser);if(!u){flash('Seleccioná un usuario para desactivar.');return}if(u.id===current.id){flash('No podés desactivar tu propia cuenta durante la sesión.');return}u.active=false;flash('Usuario desactivado.',true)}
function addToCart(){let id=Number($('#saleProduct')?.value),qty=Number($('#saleQty')?.value),p=products.find(x=>x.id===id);if(!p||!Number.isInteger(qty)||qty<1){flash('Seleccioná un producto y una cantidad válida.');return}let inCart=cart.find(x=>x.id===id),already=inCart?.qty??0;if(already+qty>p.stock){flash(`No hay suficientes existencias de ${p.name}. Disponibles: ${p.stock}.`);return}if(inCart)inCart.qty+=qty;else cart.push({id:p.id,name:p.name,price:p.price,qty});flash('Producto agregado al carrito.',true)}function removeFromCart(k){cart.splice(k,1);flash('Producto retirado del carrito.',true)}
function charge(){let total=cart.reduce((s,i)=>s+i.qty*i.price,0),cash=Number($('#cash').value);if(!cart.length){flash('No se puede cobrar: el carrito está vacío.');return}if($('#cash').value===''||!Number.isFinite(cash)||cash<total){flash(`Venta rechazada: el efectivo no alcanza para pagar. Total: ${money(total)}.`);return}for(let i of cart){let p=products.find(x=>x.id===i.id);if(!p||!p.active||p.stock<i.qty){flash(`Venta rechazada: existencias insuficientes para ${i.name}.`);return}}cart.forEach(i=>products.find(p=>p.id===i.id).stock-=i.qty);let now=new Date();let sale={id:nextSale++,iso:now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0'),date:now.toLocaleString('es-CR'),customer:'Cliente general',items:cart.map(i=>({...i})),total,cash,change:cash-total};sales.push(sale);cart=[];window.cashDraft='';selectedSale=sale.id;flash(`Venta #${sale.id} exitosa. Total: ${money(total)}. Cambio: ${money(sale.change)}. Consultá el ticket en Historial y Tickets.`,true)}
function historyRows(arr){return arr.length?arr.map(s=>`<tr class="selectable ${selectedSale===s.id?'selected':''}" onclick="selectedSale=${s.id};render()"><td>${s.id}</td><td>${escapeHTML(s.date)}</td><td>${escapeHTML(s.customer)}</td><td>${s.items.reduce((a,i)=>a+i.qty,0)}</td><td>${money(s.total)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">No hay ventas que coincidan con los filtros.</td></tr>'}
function filterHistory(){let term=$('#historySearch').value.trim().toLowerCase(),a=$('#dateFrom').value,b=$('#dateTo').value;searchHistory=term;$('#historyRows').innerHTML=historyRows(sales.filter(s=>(s.id+' '+s.customer+' '+s.date).toLowerCase().includes(term)&&(!a||s.iso>=a)&&(!b||s.iso<=b)))}
function ticketText(s){return `LA PULPE\nSistema de ventas e inventario\n-----------------------------\nTicket N°: ${s.id}\nFecha: ${s.date}\nCliente: ${s.customer}\n-----------------------------\n${s.items.map(i=>`${i.name} x${i.qty} — ${money(i.qty*i.price)}`).join('\n')}\n-----------------------------\nTOTAL: ${money(s.total)}\nEFECTIVO: ${money(s.cash)}\nCAMBIO: ${money(s.change)}\nGracias por su compra.\n`}
function downloadTicket(ext){let s=sales.find(x=>x.id===selectedSale);if(!s){flash('Seleccioná una venta del historial para generar el ticket.');return}let content=ext==='txt'?ticketText(s):`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Ticket ${s.id} - La Pulpe</title><style>body{font-family:Arial;max-width:450px;margin:30px auto;padding:20px;border:1px solid #aaa}pre{white-space:pre-wrap;line-height:1.6}</style></head><body><pre>${escapeHTML(ticketText(s))}</pre></body></html>`;let blob=new Blob([content],{type:ext==='txt'?'text/plain;charset=utf-8':'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`LaPulpe_Ticket_${s.id}.${ext}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);flash(`Ticket ${ext.toUpperCase()} generado correctamente.`,true)}
render();
</script></body></html>
